name: Deploy su GitHub Pages

# Builda il sito statico e lo pubblica su GitHub Pages.
# Richiede: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/baseball-simulator-text-700r12
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NON annullare un deploy in corso: se due merge su main arrivano ravvicinati,
  # il deploy della main "buona" veniva cancellato (cancel-in-progress) lasciando
  # il sito fermo al build precedente. Come da template ufficiale GitHub Pages,
  # lasciamo COMPLETARE il deploy in corso e accodiamo il successivo.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
